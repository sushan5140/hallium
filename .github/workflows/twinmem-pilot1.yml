name: TwinMem Pilot 1 calibrated reliability

on:
  pull_request:
    paths:
      - "research/twinmem_pilot1/**"
      - ".github/workflows/twinmem-pilot1.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run calibrated-reliability experiment
        run: python research/twinmem_pilot1/calibrated_reliability.py
      - name: Check output structure and pinned accuracies
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path("research/twinmem_pilot1")
          d=json.loads((root/"outputs/results.json").read_text())
          assert d["status"]=="synthetic_research_only"
          assert d["primary"]["test_profiles"]==480
          assert d["primary"]["test_queries_per_method"]==5760
          assert len(d["primary"]["summary"])==12
          assert len(d["source_shift"]["frozen_original_calibration_summary"])==12
          assert len(d["source_shift"]["recalibrated_summary"])==3
          assert set(d["primary"]["calibration"])=={"verified_assessment","practice_result","self_report"}

          got=[]
          for scenario,rows in (
            ("primary",d["primary"]["summary"]),
            ("shift_frozen",d["source_shift"]["frozen_original_calibration_summary"]),
            ("shift_recalibrated",d["source_shift"]["recalibrated_summary"]),
          ):
              for row in rows:
                  got.append({
                      "scenario":scenario,
                      "method":row["method"],
                      "word_budget":str(row["word_budget"]),
                      "accuracy":str(row["accuracy"]),
                  })
          with (root/"expected_accuracy.csv").open(newline="") as f:
              expected=list(csv.DictReader(f))
          assert got==expected, (got,expected)
          print("PASS: Pilot 1 output structure and exact committed accuracies")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: twinmem-pilot1-calibrated-reliability
          path: research/twinmem_pilot1/outputs/
          retention-days: 30
