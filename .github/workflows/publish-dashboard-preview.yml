name: Publish Hallium dashboard preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-dashboard-preview.yml'
  workflow_run:
    workflows: ["Verify isolated dashboard preview"]
    types: [completed]
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hallium-standalone-preview
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout only standalone preview from gh-pages
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'gh-pages' }}
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage dashboard only (never publish the full app)
        shell: bash
        run: |
          mkdir -p _site
          cp index.html styles.css app.js .nojekyll _site/
          test -s _site/index.html
          test -s _site/app.js
      - name: Upload standalone preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
