name: Verify Hallium production health
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public production endpoints
        env:
          HALLIUM_BASE_URL: https://hallium.vercel.app
        run: node scripts/check-production.mjs
