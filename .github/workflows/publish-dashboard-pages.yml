name: Publish Hallium dashboard to GitHub Pages

on:
  push:
    branches: [gh-pages]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - '.nojekyll'
      - '.github/workflows/publish-dashboard-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hallium-dashboard-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch the standalone gh-pages website
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage only the standalone dashboard, not the full Next.js app
        run: |
          mkdir -p _site
          cp index.html styles.css app.js .nojekyll _site/
          test -s _site/index.html
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
