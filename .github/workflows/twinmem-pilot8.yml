name: TwinMem Pilot 8 alpha spending

on:
  pull_request:
    paths:
      - "research/twinmem_pilot8/**"
      - ".github/workflows/twinmem-pilot8.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run alpha-spending experiment
        run: python research/twinmem_pilot8/alpha_spending.py
      - name: Validate design and pinned negative result
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path("research/twinmem_pilot8")
          d=json.loads((root/"outputs/results.json").read_text())
          assert d["status"]=="synthetic_research_only"
          assert d["frozen"]=={
              "early_stages":[8,12,24],
              "final_stage":48,
              "meaningful_margin":0.05,
              "final_z":1.96,
              "source_bonferroni":3,
          }
          assert d["alpha_budgets"]==[0.03,0.05,0.07]
          assert set(d["spending_shapes"])=={"front","equal","late"}
          assert len(d["development_candidates"])==9
          assert d["development_repeats"]==220
          assert d["test_repeats"]==500
          assert d["selected_candidate"] is None
          assert d["heldout"] is None

          passing=[c for c in d["development_candidates"] if c["all_goals_pass"]]
          assert passing==[]

          det=[c for c in d["development_candidates"] if c["detection_pass"]]
          det.sort(key=lambda c:(c["development"]["moderate"]["mean_labels_per_source"],c["development"]["stationary"]["detection_rate"]))
          best=det[0]
          got={
              "selected_candidate":"null",
              "heldout":"null",
              "candidate_count":str(len(d["development_candidates"])),
              "passing_all_goals_count":"0",
              "best_detection_candidate_alpha":str(best["alpha_budget"]),
              "best_detection_candidate_shape":best["shape"],
              "best_detection_candidate_stationary_false_alarm":str(best["development"]["stationary"]["detection_rate"]),
              "best_detection_candidate_moderate_detection":str(best["development"]["moderate"]["detection_rate"]),
              "best_detection_candidate_moderate_mean_labels":str(best["development"]["moderate"]["mean_labels_per_source"]),
              "best_detection_candidate_severe_detection":str(best["development"]["severe"]["detection_rate"]),
              "best_detection_candidate_severe_mean_labels":str(best["development"]["severe"]["mean_labels_per_source"]),
          }
          with (root/"expected_results.csv").open(newline="") as f:
              expected={r["metric"]:r["value"] for r in csv.DictReader(f)}
          assert got==expected,(got,expected)
          print("PASS: Pilot 8 exact negative result pinned; no schedule passes all goals")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: twinmem-pilot8-alpha-spending
          path: research/twinmem_pilot8/outputs/
          retention-days: 30
