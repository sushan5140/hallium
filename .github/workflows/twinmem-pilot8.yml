name: TwinMem Pilot 8 alpha spending

on:
  pull_request:
    paths:
      - "research/twinmem_pilot8/**"
      - ".github/workflows/twinmem-pilot8.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run alpha-spending experiment
        run: python research/twinmem_pilot8/alpha_spending.py
      - name: Validate multiplicity-control design
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/twinmem_pilot8/outputs/results.json").read_text())
          assert d["status"]=="synthetic_research_only"
          assert d["frozen"]=={
              "early_stages":[8,12,24],
              "final_stage":48,
              "meaningful_margin":0.05,
              "final_z":1.96,
              "source_bonferroni":3,
          }
          assert d["alpha_budgets"]==[0.03,0.05,0.07]
          assert set(d["spending_shapes"])=={"front","equal","late"}
          assert len(d["development_candidates"])==9
          assert d["development_repeats"]==220
          assert d["test_repeats"]==500
          print("PASS: Pilot 8 early alpha-spending design is frozen")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: twinmem-pilot8-alpha-spending
          path: research/twinmem_pilot8/outputs/
          retention-days: 30
