name: TwinMem Pilot 14 baseline information

on:
  pull_request:
    paths:
      - "research/twinmem_pilot14/**"
      - ".github/workflows/twinmem-pilot14.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run baseline-information robustness matrix
        run: python research/twinmem_pilot14/baseline_information.py
      - name: Validate design and exact robustness matrix
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path("research/twinmem_pilot14")
          d=json.loads((root/"outputs/results.json").read_text())
          assert d["status"]=="synthetic_research_only"
          assert d["frozen_pilot9"]=={
              "delta":0.25,
              "alpha":0.1,
              "stages":[8,12,24,48],
          }
          assert d["baseline_sizes"]==[96,192]
          assert d["repeats_per_size_pattern_scenario"]==500
          assert set(d["bias_patterns"])=={
              "none","all_plus_0_03","all_minus_0_03","source_skew_0_03"
          }
          assert set(d["matrix"])=={"96","192"}

          m=d["matrix"]
          got={
              "robust_sizes":",".join(str(x) for x in d["baseline_sizes_robust_across_all_patterns"]),
              "size_96_robust":str(bool(m["96"]["robust_across_all_patterns"])).lower(),
              "size_96_none_stationary_false_alarm":str(m["96"]["patterns"]["none"]["distributions"]["stationary"]["detection_rate"]),
              "size_96_minus_0_03_stationary_false_alarm":str(m["96"]["patterns"]["all_minus_0_03"]["distributions"]["stationary"]["detection_rate"]),
              "size_96_source_skew_stationary_false_alarm":str(m["96"]["patterns"]["source_skew_0_03"]["distributions"]["stationary"]["detection_rate"]),
              "size_192_robust":str(bool(m["192"]["robust_across_all_patterns"])).lower(),
              "size_192_none_stationary_false_alarm":str(m["192"]["patterns"]["none"]["distributions"]["stationary"]["detection_rate"]),
              "size_192_none_moderate_detection":str(m["192"]["patterns"]["none"]["distributions"]["moderate"]["detection_rate"]),
              "size_192_plus_0_03_stationary_false_alarm":str(m["192"]["patterns"]["all_plus_0_03"]["distributions"]["stationary"]["detection_rate"]),
              "size_192_minus_0_03_stationary_false_alarm":str(m["192"]["patterns"]["all_minus_0_03"]["distributions"]["stationary"]["detection_rate"]),
              "size_192_minus_0_03_moderate_detection":str(m["192"]["patterns"]["all_minus_0_03"]["distributions"]["moderate"]["detection_rate"]),
              "size_192_source_skew_stationary_false_alarm":str(m["192"]["patterns"]["source_skew_0_03"]["distributions"]["stationary"]["detection_rate"]),
              "size_192_source_skew_moderate_detection":str(m["192"]["patterns"]["source_skew_0_03"]["distributions"]["moderate"]["detection_rate"]),
          }
          with (root/"expected_results.csv").open(newline="") as f:
              expected={r["metric"]:r["value"] for r in csv.DictReader(f)}
          assert got==expected,(got,expected)
          print("PASS: Pilot 14 exact 96-vs-192 robustness matrix pinned")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: twinmem-pilot14-baseline-information
          path: research/twinmem_pilot14/outputs/
          retention-days: 30
