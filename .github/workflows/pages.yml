name: Publish Hangul Lab preview

on:
  push:
    branches: [hangul-lab-preview]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hallium-hangul-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Expand original preview source files
        shell: bash
        run: |
          if [ ! -f index.html ]; then
            python3 - <<'PY'
          import base64, io, lzma, pathlib, tarfile
          parts = sorted(pathlib.Path('.preview-parts').glob('part-*.txt'))
          if len(parts) != 6: raise SystemExit('Expected six source archive parts')
          encoded = ''.join(p.read_text(encoding='utf-8') for p in parts)
          archive = lzma.decompress(base64.b64decode(encoded, validate=True))
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:') as tar:
              allowed = {'index.html', 'styles.css', 'app.js'}
              if {m.name for m in tar.getmembers()} != allowed:
                  raise SystemExit('Unexpected archive files')
              for entry in tar.getmembers():
                  pathlib.Path(entry.name).write_bytes(tar.extractfile(entry).read())
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html styles.css app.js
            git rm -r .preview-parts
            git commit -m 'Expose editable Hangul Lab preview source'
            git push
          fi
      - name: Verify static preview source
        run: |
          node --check app.js
          node --check writing.js
          node --check flashcards/app.js
          test -f flashcards/index.html && test -f flashcards/styles.css
          test -f index.html && test -f styles.css
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Check(HTMLParser):
              def __init__(self): super().__init__(); self.ids=set(); self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if 'id' in a: self.ids.add(a['id'])
                  if tag=='script' and 'src' in a: self.scripts.append(a['src'])
          h=Check(); h.feed(Path('index.html').read_text())
          needed=['writing-kind','writing-family','writing-target','writing-canvas','writing-guide','writing-save','writing-undo','writing-clear','writing-export','writing-trace','writing-free','writing-listen','writing-feedback','view-write']
          missing=set(needed)-h.ids
          assert not missing, f'Missing handwriting controls: {missing}'
          assert './writing.js' in h.scripts
          print('Hangul handwriting markup verified')
          PY
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Assets(HTMLParser):
              def __init__(self): super().__init__();self.ids=set();self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if 'id' in a:
                      assert a['id'] not in self.ids, f'Duplicate element id: {a["id"]}'
                      self.ids.add(a['id'])
                  if tag=='script' and 'src' in a:self.scripts.append(a['src'])
          h=Assets();h.feed(Path('flashcards/index.html').read_text())
          needed={'reveal','know','learn','save','reset','front-audio','back-audio','inline-audio','sentence-audio','notebook-button','status-chip','review-state','card','front','back'}
          assert not (needed-h.ids), 'Missing flashcard controls: '+str(needed-h.ids)
          assert './app.js' in h.scripts
          assert 'href="./flashcards/"' in Path('index.html').read_text()
          print('One-card flashcard controls and Hangul Lab navigation verified')
          PY
          mkdir -p public
          cp index.html styles.css app.js writing.js public/
          cp -R flashcards public/
          touch public/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
