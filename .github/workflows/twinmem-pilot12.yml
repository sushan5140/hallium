name: TwinMem Pilot 12 posterior predictive null

on:
  pull_request:
    paths:
      - "research/twinmem_pilot12/**"
      - ".github/workflows/twinmem-pilot12.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run posterior-predictive null experiment
        run: python research/twinmem_pilot12/posterior_predictive_null.py
      - name: Validate design and pinned development failure
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path("research/twinmem_pilot12")
          d=json.loads((root/"outputs/results.json").read_text())
          assert d["status"]=="synthetic_research_only"
          assert d["frozen"]=={
              "baseline_labels_per_source":48,
              "delta":0.25,
              "alpha":0.1,
              "stages":[8,12,24,48],
              "prior_a":2.0,
              "prior_b":2.0,
          }
          assert d["development_repeats"]==300
          assert d["test_repeats"]==500
          assert d["heldout_unbiased"] is None
          assert d["heldout_bias_stress"] is None
          got={
              "development_all_goals_pass":str(bool(d["development"]["all_goals_pass"])).lower(),
              "development_stationary_false_alarm":str(d["development"]["distributions"]["stationary"]["detection_rate"]),
              "development_moderate_detection":str(d["development"]["distributions"]["moderate"]["detection_rate"]),
              "development_moderate_mean_labels":str(d["development"]["distributions"]["moderate"]["mean_labels_per_source"]),
              "development_severe_detection":str(d["development"]["distributions"]["severe"]["detection_rate"]),
              "development_severe_mean_labels":str(d["development"]["distributions"]["severe"]["mean_labels_per_source"]),
              "heldout_unbiased":"null",
              "heldout_bias_stress":"null",
          }
          with (root/"expected_results.csv").open(newline="") as f:
              expected={r["metric"]:r["value"] for r in csv.DictReader(f)}
          assert got==expected,(got,expected)
          print("PASS: Pilot 12 exact development power failure pinned")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: twinmem-pilot12-posterior-predictive-null
          path: research/twinmem_pilot12/outputs/
          retention-days: 30
