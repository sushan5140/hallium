name: TwinMem Pilot 6 sequential drift

on:
  pull_request:
    paths:
      - "research/twinmem_pilot6/**"
      - ".github/workflows/twinmem-pilot6.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run sequential drift experiment
        run: python research/twinmem_pilot6/sequential_drift.py
      - name: Validate frozen sequential design
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/twinmem_pilot6/outputs/results.json").read_text())
          assert d["status"]=="synthetic_research_only"
          assert d["frozen_detector"]=={
              "stages":[8,12,24,48],
              "meaningful_margin":0.05,
              "zcrit":1.96,
              "consecutive_early_drift_signals_required":2,
              "final_stage_uses_pilot5_rule":True,
          }
          assert d["detection_criteria"]=={
              "stationary_false_alarm_max":0.1,
              "moderate_detection_min":0.8,
              "severe_detection_min":0.9,
          }
          assert d["efficiency_goals"]=={
              "moderate_mean_labels_per_source_max":36.0,
              "severe_mean_labels_per_source_max":24.0,
          }
          assert d["repeats"]==400
          print("PASS: Pilot 6 sequential stages, stopping rule, and predeclared criteria")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: twinmem-pilot6-sequential-drift
          path: research/twinmem_pilot6/outputs/
          retention-days: 30
