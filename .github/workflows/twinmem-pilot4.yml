name: TwinMem Pilot 4 label efficiency

on:
  pull_request:
    paths:
      - "research/twinmem_pilot4/**"
      - ".github/workflows/twinmem-pilot4.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run label-efficiency experiment
        run: python research/twinmem_pilot4/label_efficiency.py
      - name: Validate predeclared design
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/twinmem_pilot4/outputs/results.json").read_text())
          assert d["status"]=="synthetic_research_only"
          assert d["detector_threshold"]==0.2
          assert d["repeats_per_window_scenario"]==250
          assert [r["window_per_source"] for r in d["window_results"]]==[4,8,12,24,48]
          assert d["criteria"]=={
              "stationary_false_alarm_max":0.1,
              "moderate_detection_min":0.8,
              "severe_detection_min":0.9,
          }
          print("PASS: Pilot 4 frozen detector, label windows, repeats, and predeclared criteria")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: twinmem-pilot4-label-efficiency
          path: research/twinmem_pilot4/outputs/
          retention-days: 30
