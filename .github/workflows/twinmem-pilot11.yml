name: TwinMem Pilot 11 null interval

on:
  pull_request:
    paths:
      - "research/twinmem_pilot11/**"
      - ".github/workflows/twinmem-pilot11.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run conservative null-interval experiment
        run: python research/twinmem_pilot11/null_interval.py
      - name: Validate frozen null-handling design
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/twinmem_pilot11/outputs/results.json").read_text())
          assert d["status"]=="synthetic_research_only"
          assert d["frozen_pilot9"]=={
              "baseline_labels_per_source":48,
              "delta":0.25,
              "alpha":0.1,
              "stages":[8,12,24,48],
          }
          assert d["interval_levels"]==[0.7,0.8,0.9,0.95]
          assert d["development_repeats"]==260
          assert d["test_repeats"]==500
          assert len(d["development_candidates"])==4
          print("PASS: Pilot 11 conservative-null development grid is frozen")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: twinmem-pilot11-null-interval
          path: research/twinmem_pilot11/outputs/
          retention-days: 30
