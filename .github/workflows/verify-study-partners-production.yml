name: Verify Study Partners production integration

on:
  push:
    branches: [feature/study-partners-production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test matching and evidence-grounded practice
        run: node --test tests/study-partners-core.test.mjs
      - name: Compile integrated Hallium
        run: npm run build
      - name: Smoke-test Hallium, Hangul Lab and Study Partners
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 >/tmp/partners-release.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/study-partners >/tmp/partners.html; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then cat /tmp/partners-release.log; exit 1; fi
          curl --fail --silent http://127.0.0.1:3000/ >/tmp/home.html
          curl --fail --silent http://127.0.0.1:3000/hangul >/tmp/hangul.html
          curl --fail --silent http://127.0.0.1:3000/hangul-lab/writing.js >/dev/null
          grep -q 'Study Partners' /tmp/partners.html
          grep -q 'href="/study-partners"' app/page.js
          api_status=$(curl -s -o /tmp/api.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/study-partners/practice -H 'Content-Type: application/json' -d '{"connectionId":"11111111-1111-1111-1111-111111111111"}')
          test "$api_status" = "401"
          echo "PASS: original Hallium, Hangul Lab, real Study Partners and protected AI route."
