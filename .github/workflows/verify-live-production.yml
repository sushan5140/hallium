name: Verify Hallium live production

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/verify-live-production.cjs'
      - '.github/workflows/verify-live-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-production:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.0
          npx playwright install --with-deps chromium
      - name: Run live production interaction suite
        run: node .github/scripts/verify-live-production.cjs
