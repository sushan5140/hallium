name: Verify local Hallium + Hangul Lab

on:
  push:
    branches: [local/hangul-integrated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hallium-local-hangul
  cancel-in-progress: true

jobs:
  local-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build full Hallium locally
        run: npm run build
      - name: Start localhost and smoke-test both sections
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/hallium-local.log 2>&1 &
          local_pid=$!
          trap 'kill "$local_pid" 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:3000/hangul > /tmp/hangul-route.html; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then cat /tmp/hallium-local.log; exit 1; fi
          curl --fail --silent http://127.0.0.1:3000/ > /tmp/hallium-home.html
          curl --fail --silent http://127.0.0.1:3000/hangul-lab/index.html > /tmp/hangul-static.html
          curl --fail --silent http://127.0.0.1:3000/hangul-lab/app.js > /tmp/hangul-app.js
          curl --fail --silent http://127.0.0.1:3000/hangul-lab/styles.css > /tmp/hangul-styles.css
          curl --fail --silent http://127.0.0.1:3000/hangul-lab/writing.js > /tmp/hangul-writing.js
          grep -q 'Back to Hallium' /tmp/hangul-route.html
          grep -q 'hangul-lab/index.html' /tmp/hangul-route.html
          grep -q 'Hangul Lab' /tmp/hangul-static.html
          grep -q 'writing-canvas' /tmp/hangul-static.html
          grep -q 'family-preview-continue' /tmp/hangul-static.html
          node --check public/hangul-lab/app.js
          node --check public/hangul-lab/writing.js
          echo "PASS: Hallium home, dedicated Hangul route, all four static assets, and handwriting UI respond on localhost."
