name: TwinMem Pilot 13 predictive null point alternatives

on:
  pull_request:
    paths:
      - "research/twinmem_pilot13/**"
      - ".github/workflows/twinmem-pilot13.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run predictive-null point-alternative experiment
        run: python research/twinmem_pilot13/predictive_null_point_alt.py
      - name: Validate frozen Pilot 13 design
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research/twinmem_pilot13/outputs/results.json").read_text())
          assert d["status"]=="synthetic_research_only"
          assert d["frozen"]=={
              "baseline_labels_per_source":48,
              "delta":0.25,
              "alpha":0.1,
              "stages":[8,12,24,48],
              "prior_a":2.0,
              "prior_b":2.0,
              "null_model":"beta_posterior_predictive",
              "alternative_model":"point_posterior_mean_plus_minus_delta",
          }
          assert d["development_repeats"]==320
          assert d["test_repeats"]==500
          print("PASS: Pilot 13 null/alternative models and frozen detector verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: twinmem-pilot13-predictive-null-point-alt
          path: research/twinmem_pilot13/outputs/
          retention-days: 30
