name: One-time Next security upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-next-security.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Upgrade patched Next.js and regenerate lockfile
        run: npm install next@16.3.6 --save-exact --package-lock-only
      - name: Install exact dependency tree
        run: npm ci
      - name: Reject critical production dependency advisories
        run: npm audit --omit=dev --audit-level=critical
      - name: Compile Hallium
        run: npm run build
      - name: Commit patched dependency files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade Next.js to patched 16.3.6"
          git push origin HEAD:main
