name: Verify TOPIK provenance gates
on:
  push:
    branches: [main]
    paths:
      - 'app/topik-mocks/**'
      - 'app/topik-companion/**'
      - 'lib/topik/**'
      - 'lib/korean-voice.js'
      - 'supabase/migrations/20261002000100_voice_preferences.sql'
      - '.github/scripts/verify-topik-mocks.cjs'
      - '.github/workflows/verify-topik-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  topik:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.58.0
      - run: npx playwright install --with-deps chromium
      - name: Start Hallium
        run: |
          npm run dev >/tmp/hallium-topik.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3000/topik-mocks >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hallium-topik.log
          exit 1
      - name: Verify TOPIK source and practice gates
        run: node .github/scripts/verify-topik-mocks.cjs
